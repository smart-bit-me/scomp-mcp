name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # OIDC → Sigstore build provenance
      attestations: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          REF_NAME: ${{ github.ref_name }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${REF_NAME}" \
            -o scomp-mcp-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/scomp-mcp

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: scomp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Checksum
        run: sha256sum scomp-mcp-${{ matrix.goos }}-${{ matrix.goarch }} > scomp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

      - name: Upload binary and checksum to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            scomp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
            scomp-mcp-${{ matrix.goos }}-${{ matrix.goarch }}.sha256

  checksums:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all per-binary checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern '*.sha256' --dir sums/

      - name: Merge into checksums.txt
        run: cat sums/*.sha256 | sort > checksums.txt

      - name: Upload checksums.txt to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: checksums.txt
