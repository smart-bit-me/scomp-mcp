name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: vet
        run: go vet ./...

      - name: test-race
        run: go test -race ./...

      - name: coverage
        run: go test -coverprofile=coverage.out ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64  go build ./cmd/scomp-mcp
          CGO_ENABLED=0 GOOS=linux  GOARCH=arm64  go build ./cmd/scomp-mcp
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64  go build ./cmd/scomp-mcp
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64  go build ./cmd/scomp-mcp
